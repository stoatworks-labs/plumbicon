name: ci

# macOS only, and deliberately. The CMakeLists branches on APPLE and WIN32 and
# has no Linux path at all, so ubuntu is not an option; Windows needs GLEW from
# vcpkg, which is a slow, fragile thing to put in front of every pull request
# for a compile break that would almost certainly show up on macOS too. The
# release workflow still builds both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DPLUMBICON_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Parameters, with no GL context at all
        # `--list` is answered before a context is created, precisely so that
        # it still works on a runner where creating one fails. It is a real
        # check: the parameter declaration is where an FFGL plugin most often
        # goes wrong, and a duplicate or missing name breaks --set and the
        # sweep without breaking the build.
        run: ./build/pbtest --list

      - name: Every shader, through a real GLSL compiler
        # The most valuable thing this runner can do. Four of this plugin's six
        # shaders are ASSEMBLED at run time around the shared target model, so
        # they exist in no file on disk and a break in them surfaces only as
        # "the effect does nothing" inside a host. glslc needs no GPU.
        run: |
          brew install shaderc
          tools/verify.sh 2>&1 | sed -n '1,8p'

      - name: The physics, if this runner can make a GL context
        # Best effort, and the honest reason is in the CI section of AGENTS.md:
        # EVERY numeric check in this repo renders, because the model lives in
        # GLSL rather than in C++. A hosted macOS runner has no accelerated GL,
        # and whether the software fallback can give a 4.1 core context is a
        # fact about the runner rather than about this code.
        #
        # These are NOT waived. They run for real, at two rasters each, in
        # tools/verify.sh on a machine with a GPU, and that is the gate.
        continue-on-error: true
        run: |
          ./build/pbtest --lag
          ./build/pbtest --comet
          ./build/pbtest --capacity
          ./build/pbtest --burn
          ./build/pbtest --passthrough

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem -- and a
      # bump to actions/upload-artifact otherwise touches release.yml alone, a
      # workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: plumbicon-macos-arm64
          path: build/*.bundle
          if-no-files-found: error
